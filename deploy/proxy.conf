# Application reverse proxy ('proxy' container).
# The only service exposed on the host; routes to 'api' and 'ui' on the internal network.
# The host's reverse proxy (TLS + domain) only needs to forward to this container.
server {
    listen 80;
    server_name _;

    # API: /popcorn-index/* -> api:8080/*  (the trailing / strips the prefix)
    location /popcorn-index/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Everything else -> SPA served by the ui container
    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
