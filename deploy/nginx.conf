server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Immutable assets (hash in the name): long cache
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No API proxy here: the host's reverse proxy routes /popcorn-index/*
    # directly to the 'api' container. This container only serves the SPA.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
