<div class="flex flex-1 items-center">
  <button mat-button routerLink="home" class="text-on-primary! text-base! sm:text-xl!">Home</button>
  <button mat-button routerLink="search" class="text-on-primary! text-base! sm:text-xl!">Search</button>
  @if (isAuthenticated()) {
    <button mat-button routerLink="my-reviews" class="text-on-primary! text-base! sm:text-xl!">My Reviews</button>
  }

  <span class="flex-1"></span>

  @if (isAuthenticated()) {
    <button mat-button (click)="logout()" class="text-on-primary! text-base! sm:text-xl!">Logout</button>
  } @else {
    <button mat-button routerLink="login" class="text-on-primary! text-base! sm:text-xl!">Login</button>
  }
</div>
