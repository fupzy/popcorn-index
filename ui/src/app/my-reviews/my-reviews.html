<mat-card class="flex flex-1 w-full min-h-0 overflow-hidden">
  <mat-card-content class="grid! grid-rows-[auto_1fr] gap-4 w-full min-h-0 h-full">
    <h1 class="text-2xl font-semibold m-0 text-(--mat-sys-primary)">My Reviews</h1>

    @if (isLoading()) {
      <div class="flex items-center justify-center min-h-0">
        <mat-progress-spinner mode="indeterminate" diameter="32" />
      </div>
    } @else if (errorMessage(); as message) {
      <div class="flex items-center justify-center min-h-0">
        <p class="text-sm text-error m-0" role="alert">{{ message }}</p>
      </div>
    } @else if (sortedReviews().length === 0) {
      <div class="flex items-center justify-center min-h-0">
        <p class="text-sm opacity-70 m-0">You have not written any reviews yet.</p>
      </div>
    } @else {
      <div class="flex flex-col gap-3 overflow-y-auto min-h-0">
        @for (review of sortedReviews(); track review.id) {
          <app-my-review-item [review]="review" />
        }
      </div>
    }
  </mat-card-content>
</mat-card>
