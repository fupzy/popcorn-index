<div class="flex flex-col gap-2">
  <a [routerLink]="mediaLink()" class="flex items-center gap-2 text-sm font-semibold text-(--mat-sys-primary) no-underline hover:underline">
    <mat-icon class="text-base!">{{ review().mediaType === 'Movie' ? 'movie' : 'tv' }}</mat-icon>
    <span>{{ mediaTypeLabel() }} · {{ mediaTitle() ?? 'Loading…' }}</span>
  </a>
  <app-review-card [review]="review()" />
</div>
