<div class="contents" role="radiogroup" [attr.aria-label]="ariaLabel()" (mouseleave)="clearPreview()">
  @for (star of stars(); track star) {
    @if (interactive()) {
      <span class="relative inline-flex leading-none text-rating-star!">
        <mat-icon aria-hidden="true">{{ iconFor(star) }}</mat-icon>

        <button
          type="button"
          role="radio"
          class="absolute inset-y-0 left-0 w-1/2 bg-transparent border-0 p-0 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-rating-star rounded-sm"
          [attr.aria-label]="halfLabel(star)"
          [attr.aria-checked]="value() === star * 2 - 1"
          (mouseenter)="previewValue(star * 2 - 1)"
          (focus)="previewValue(star * 2 - 1)"
          (blur)="clearPreview()"
          (click)="setValue(star * 2 - 1)"></button>

        <button
          type="button"
          role="radio"
          class="absolute inset-y-0 right-0 w-1/2 bg-transparent border-0 p-0 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-rating-star rounded-sm"
          [attr.aria-label]="fullLabel(star)"
          [attr.aria-checked]="value() === star * 2"
          (mouseenter)="previewValue(star * 2)"
          (focus)="previewValue(star * 2)"
          (blur)="clearPreview()"
          (click)="setValue(star * 2)"></button>
      </span>
    } @else {
      <mat-icon class="text-rating-star!" aria-hidden="true">{{ iconFor(star) }}</mat-icon>
    }
  }
</div>
